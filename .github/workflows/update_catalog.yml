name: Katalog Guncelle

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri yükle
        run: pip install curl_cffi beautifulsoup4

      - name: Film kataloğunu güncelle
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python scraper_movie.py

      - name: Dizi kataloğunu güncelle
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python scraper_series.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/
          git commit -m "Katalog guncellendi" || exit 0
          git push
