name: Filmmodu Canli Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri yükle
        run: pip install curl_cffi beautifulsoup4

      - name: Testi çalıştır ve dosyaya yaz
        run: python test_filmmodu.py > sonuc.txt 2>&1 || true

      - name: Sonucu repoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sonuc.txt
          git commit -m "Test sonucu guncellendi" || exit 0
          git push
